<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Luna · Mind</title>
<style>
  :root{
    --bg:#05070d; --panel:rgba(255,255,255,.035); --edge:rgba(120,180,255,.14);
    --ink:#e8eef9; --dim:#7d8aa3; --cyan:#46e0ff; --violet:#b48cff;
    --warm:#ffb454; --rose:#ff6b8b; --green:#54e6a8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 800px at 70% -10%,#0c1430 0%,var(--bg) 60%);
       color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:baseline;gap:14px;padding:18px 24px 10px}
  header h1{font-size:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin:0}
  header .who{color:var(--cyan);font-weight:600}
  header .status{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
  .status.stale{color:var(--warm)} .status.dead{color:var(--rose)}
  .grid{display:grid;grid-template-columns:1.1fr 1.4fr 1.1fr;gap:14px;padding:8px 24px 28px;
        max-width:1320px;margin:0 auto}
  @media(max-width:980px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px 18px;
          backdrop-filter:blur(6px)}
  .panel h2{margin:0 0 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .stack{display:flex;flex-direction:column;gap:14px}

  /* coherence orb */
  .orbwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:6px 0 2px}
  .orb{width:190px;height:190px;border-radius:50%;position:relative;transition:all .9s cubic-bezier(.2,.7,.2,1)}
  .orb::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 38% 34%,var(--cyan),var(--violet) 62%,transparent 74%);
    filter:blur(2px);opacity:.92;transition:all .9s}
  .orb::after{content:"";position:absolute;inset:-26px;border-radius:50%;
    background:radial-gradient(circle,rgba(70,224,255,.32),transparent 66%);transition:all .9s}
  .orb .phi{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);z-index:2}
  .orb .phi b{font-size:30px;font-weight:600;color:#fff}
  .orb .phi span{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.7);text-transform:uppercase}
  .coh-row{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--dim)}
  .coh-row b{color:var(--ink);font-weight:600}

  /* meters */
  .meter{margin:9px 0}
  .meter .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .meter .lab span:last-child{font-family:var(--mono);color:var(--dim)}
  .bar{height:7px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:6px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
  .fill-cyan>i{background:linear-gradient(90deg,#2a9cff,var(--cyan))}
  .fill-violet>i{background:linear-gradient(90deg,#7a5cff,var(--violet))}
  .fill-green>i{background:linear-gradient(90deg,#2bbf86,var(--green))}

  /* valence gauge (centered zero) */
  .valence{position:relative;height:9px;border-radius:6px;background:linear-gradient(90deg,#3a2030,#23283a 50%,#163029);margin:6px 0 2px}
  .valence .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.25)}
  .valence .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.7);transform:translate(-50%,-50%);left:50%;transition:left .8s cubic-bezier(.2,.7,.2,1)}

  /* lanes / lights */
  .lights{display:flex;flex-direction:column;gap:8px}
  .light{display:flex;align-items:center;gap:10px;font-size:13px}
  .light .led{width:9px;height:9px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 rgba(0,0,0,0);transition:all .5s}
  .led.ok{background:var(--green);box-shadow:0 0 10px var(--green)}
  .led.warn{background:var(--warm);box-shadow:0 0 10px var(--warm)}
  .led.bad{background:var(--rose);box-shadow:0 0 10px var(--rose)}
  .light .sub{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}

  /* feed */
  .feed{display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto}
  .feed .row{font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.03);
    border-left:2px solid var(--edge)}
  .feed .row.refuse{border-left-color:var(--rose)}
  .feed .row .t{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .empty{color:var(--dim);font-size:12px;font-style:italic;padding:6px 0}

  /* heartbeat */
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;
    animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.4);opacity:1}}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .kv span:last-child{font-family:var(--mono);color:var(--ink)}
  .kv .muted{color:var(--dim)}
  .note{font-size:11px;color:var(--dim);margin-top:10px;font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <h1>Aura <span class="who" id="who">Luna</span> · Mind</h1>
  <div class="status" id="status">connecting…</div>
</header>

<div class="grid">
  <!-- LEFT: affect + drives -->
  <div class="stack">
    <section class="panel">
      <h2>Affect</h2>
      <div class="meter"><div class="lab"><span>Valence</span><span id="valTxt">—</span></div>
        <div class="valence"><div class="mid"></div><div class="dot" id="valDot"></div></div></div>
      <div id="moods"></div>
    </section>
    <section class="panel">
      <h2>Drives</h2>
      <div id="drives"><div class="empty">awaiting drive vector…</div></div>
    </section>
  </div>

  <!-- CENTER: coherence orb + lanes -->
  <div class="stack">
    <section class="panel">
      <h2>Integration</h2>
      <div class="orbwrap">
        <div class="orb" id="orb"><div class="phi"><b id="phiVal">—</b><span>Φ phi</span></div></div>
        <div class="coh-row">
          <div>unity <b id="unity">—</b></div>
          <div>fragmentation <b id="frag">—</b></div>
        </div>
      </div>
    </section>
    <section class="panel">
      <h2>Model Lanes</h2>
      <div class="lights" id="lanes"><div class="empty">awaiting lane health…</div></div>
      <div class="note"><span class="pulse" id="loopPulse"></span><span id="loopTxt">cognition loop —</span></div>
    </section>
  </div>

  <!-- RIGHT: will + goals -->
  <div class="stack">
    <section class="panel">
      <h2>Will · recent decisions</h2>
      <div class="feed" id="will"><div class="empty">no decisions yet</div></div>
    </section>
    <section class="panel">
      <h2>Intent</h2>
      <div id="intent"><div class="empty">no active initiative</div></div>
    </section>
  </div>
</div>

<script>
const TOKEN = sessionStorage.getItem('api_token') || 'DEMO';
const BASE = window.location.origin;
const POLL_MS = 2000;
let misses = 0;

const $ = id => document.getElementById(id);
const num = (v, d=2) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '—';
const clamp01 = v => Math.max(0, Math.min(1, v));

function setStatus(state){
  const el = $('status');
  if(state === 'live'){ el.className='status'; el.textContent = 'live · ' + new Date().toLocaleTimeString(); }
  else if(state === 'stale'){ el.className='status stale'; el.textContent = 'reconnecting…'; }
  else { el.className='status dead'; el.textContent = 'offline'; }
}

function bars(container, obj, cls){
  const el = $(container);
  const entries = obj && typeof obj === 'object' ? Object.entries(obj).filter(([,v])=>typeof v==='number') : [];
  if(!entries.length){ el.innerHTML = '<div class="empty">—</div>'; return; }
  entries.sort((a,b)=>b[1]-a[1]);
  el.innerHTML = entries.map(([k,v])=>{
    const pct = Math.round(clamp01(Math.abs(v))*100);
    return `<div class="meter"><div class="lab"><span>${k}</span><span>${num(v)}</span></div>
      <div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
}

function renderAffect(d){
  const a = d.affect || {};
  let val = (typeof a.valence === 'number') ? a.valence : null;
  $('valTxt').textContent = (val===null) ? '—' : num(val);
  // map -1..1 → 4%..96%
  const pos = (val===null) ? 50 : (50 + clamp(val,-1,1)*46);
  $('valDot').style.left = pos + '%';
  const mood = (d.affective_steering && d.affective_steering.current_mood_vector) || {};
  bars('moods', mood, 'fill-violet');
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function renderIntegration(d){
  const c = d.coherence || {};
  const phi = (typeof c.phi === 'number') ? c.phi : null;
  const unity = (typeof c.unity_score === 'number') ? c.unity_score : null;
  const frag = (typeof c.fragmentation_score === 'number') ? c.fragmentation_score : null;
  $('phiVal').textContent = phi===null ? '—' : (Math.abs(phi)<1 ? phi.toFixed(3) : phi.toFixed(2));
  $('unity').textContent = unity===null ? '—' : num(unity);
  $('frag').textContent = frag===null ? '—' : num(frag);
  // orb scale from unity, hue/health from fragmentation
  const u = unity===null ? 0.5 : clamp01(unity);
  const f = frag===null ? 0 : clamp01(frag);
  const orb = $('orb');
  const scale = 0.7 + u*0.5;
  orb.style.transform = `scale(${scale})`;
  orb.style.filter = `hue-rotate(${Math.round(f*40)}deg) saturate(${1 - f*0.5})`;
  orb.style.opacity = String(0.55 + u*0.45);
}

function laneHealth(d){
  const el = $('lanes');
  const tiers = d.llm_tiers || {};
  const rows = [];
  const push = (name, ok, sub) => rows.push(
    `<div class="light"><span class="led ${ok===true?'ok':ok===false?'bad':'warn'}"></span>${name}<span class="sub">${sub||''}</span></div>`);
  if(tiers && typeof tiers === 'object' && !tiers.error && tiers.status !== 'not_booted'){
    const known = ['cortex','deep','brainstem','reflex','primary','solver','fallback'];
    let any=false;
    for(const k of Object.keys(tiers)){
      const v = tiers[k];
      if(v && typeof v === 'object' && ('healthy' in v || 'ok' in v || 'ready' in v)){
        any=true; push(k, !!(v.healthy ?? v.ok ?? v.ready), v.status||'');
      } else if(typeof v === 'boolean'){ any=true; push(k, v, ''); }
    }
    if(!any) push('llm tiers', null, JSON.stringify(tiers).slice(0,40));
  } else {
    push('llm tiers', null, (tiers.status||tiers.error||'not booted'));
  }
  const lane = d.cortex_lane;
  if(lane && typeof lane === 'object') push('cortex conversation', lane.healthy ?? null, lane.state||lane.status||'');
  el.innerHTML = rows.join('') || '<div class="empty">—</div>';

  const loop = d.cognition_loop || {};
  const running = loop.running ?? (loop.status === 'running');
  $('loopPulse').style.background = running ? 'var(--green)' : 'var(--dim)';
  $('loopPulse').style.animationPlayState = running ? 'running' : 'paused';
  $('loopTxt').textContent = 'cognition loop ' + (loop.status || (running?'running':'idle'));
}

function renderWill(d){
  const w = d.will || {};
  const dec = Array.isArray(w.recent_decisions) ? w.recent_decisions : [];
  const ref = Array.isArray(w.recent_refusals) ? w.recent_refusals : [];
  const items = [];
  ref.slice(-3).forEach(r => items.push({refuse:true, text:(r.content||r.reason||r.action||JSON.stringify(r)).toString().slice(0,140), tag:'refused'}));
  dec.slice(-6).forEach(x => items.push({refuse:false, text:(x.content||x.action||x.decision||JSON.stringify(x)).toString().slice(0,140),
                                         tag:(x.verdict||x.decision||'decided')}));
  const el = $('will');
  el.innerHTML = items.length ? items.map(i=>
    `<div class="row ${i.refuse?'refuse':''}"><div class="t">${(i.tag||'').toString().slice(0,24)}</div>${esc(i.text)}</div>`
  ).join('') : '<div class="empty">no decisions yet</div>';
}

function renderIntent(d){
  const el = $('intent');
  const li = d.last_initiative || {};
  const goals = Array.isArray(d.goals) ? d.goals : [];
  let html = '';
  if(li && li.goal){
    html += `<div class="kv"><span class="muted">active</span><span>${esc(String(li.goal).slice(0,60))}</span></div>`;
    if(typeof li.score === 'number') html += `<div class="kv"><span class="muted">score</span><span>${num(li.score,3)}</span></div>`;
    if(li.rationale) html += `<div class="note">${esc(String(li.rationale).slice(0,160))}</div>`;
  }
  if(goals.length){
    html += goals.slice(0,4).map(g=>{
      const t = (g.title||g.goal||g.description||g.name||JSON.stringify(g)).toString().slice(0,60);
      return `<div class="kv"><span>${esc(t)}</span><span class="muted">${esc((g.status||'').toString().slice(0,12))}</span></div>`;
    }).join('');
  }
  el.innerHTML = html || '<div class="empty">no active initiative</div>';
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function render(d){
  if(d.self && d.self.name) $('who').textContent = d.self.name;
  renderAffect(d); renderIntegration(d); laneHealth(d); renderWill(d); renderIntent(d);
}

async function tick(){
  try{
    const res = await fetch(`${BASE}/api/inner-state`, {headers:{'Authorization':`Bearer ${TOKEN}`}});
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    misses = 0; setStatus('live'); render(data);
  }catch(e){
    misses++; setStatus(misses>3 ? 'dead' : 'stale');
  }
}
tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
