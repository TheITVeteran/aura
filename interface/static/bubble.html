<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aura</title>
<link rel="stylesheet" href="/static/design_tokens.css"/>
<style>
/*
  The bubble. Small, detached, draggable, and silent until she has something.

  Two states and nothing else:

    dormant   just the neuron. No bar, no label, no placeholder text. A
              placeholder like "What can I help you with today?" is chrome
              asking to be noticed; this surface does not ask.
    speaking  the neuron plus one line of what she said, and a dismiss.

  The whole window is transparent and click-through except the glyph and the
  message, so a bubble sitting over an editor does not eat clicks meant for
  the editor.
*/
:root {
  --bubble-bg: rgba(22, 20, 32, 0.92);
  --bubble-edge: rgba(160, 130, 255, 0.28);
  --bubble-text: #e8e2f6;
  --bubble-dim: rgba(232, 226, 246, 0.55);
  /* drop-shadow, not box-shadow: the glow has to follow the neuron's own
     silhouette. A box-shadow haloed the square <img> bounding box, which is
     why the resting mark read as a disc inside a disc. */
  --neuron-idle: none;
  --neuron-live: drop-shadow(0 0 5px rgba(150, 110, 255, 0.7));
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  overflow: hidden;
  /* The window is a passthrough by default; only the pill takes clicks. */
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

#pill {
  pointer-events: auto;
  position: absolute;
  left: 8px; top: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 9px;
  border-radius: 999px;
  background: var(--bubble-bg);
  border: 1px solid var(--bubble-edge);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 6px 22px rgba(0,0,0,0.42);
  /* AppKit resizes the native panel to this measured content. Keeping this
     independent of the current viewport lets a 40px dormant panel grow again
     when a message arrives. */
  max-width: 504px;
  /* The drag handle IS the pill. macOS moves the panel from here. */
  -webkit-app-region: drag;
  transition: padding 140ms ease, background 200ms ease;
}

/*
  Dormant is the neuron and nothing else.

  It used to be a bordered disc with a 26px glyph floating inside 7px of
  padding, and the glyph carried its own border-radius and glow — so the
  resting state was a ring inside a ring around a shrunken mark. Three
  concentric shapes to say one thing.

  What is left is a scrim, not a button: no border, sized snugly to the mark,
  dark enough that a light-coloured neuron still reads over a white editor.
  The disc is there for legibility over an unknown background, which is the
  only thing it is allowed to be there for.
*/
#pill.dormant {
  padding: 6px;
  gap: 0;
  background: rgba(20, 18, 30, 0.9);
  /* One faint edge, not the old ring-around-a-ring. It has to be readable
     enough that the unread dot looks like it is ON something — at 0.72 alpha
     over a dark editor the disc vanished and the dot read as a loose speck
     floating beside the neuron. */
  border-color: rgba(160, 130, 255, 0.16);
  box-shadow: 0 4px 14px rgba(0,0,0,0.38);
}

#glyph {
  /* One size in every state. Growing the mark when she stops speaking is a
     tic: the eye reads a resize in the corner of the screen as something
     having happened, and nothing has. Snug in 6px of scrim, so the resting
     bubble is 40px across. */
  width: 28px; height: 28px;
  flex: 0 0 28px;
  -webkit-app-region: no-drag;
  cursor: pointer;
  transition: filter 320ms ease, transform 160ms ease;
  filter: var(--neuron-idle);
}
#glyph:active { transform: scale(0.94); }

/* The unread dot: "open me when you can", not a modal.
 *
 * It lights in the UNREAD state, not the speaking one. Lighting it beside a
 * message already spelled out on screen made it decoration — it said "there
 * is something here" while the something was legible an inch to its right.
 *
 * Its job starts when the text withdraws: after a while unacknowledged she
 * collapses back to the glyph, and the dot is what is left. That is the whole
 * "open me when you can" idea — a sentence someone did not read must not sit
 * over their work forever, and it must not vanish without a trace either. */
#glyph-wrap { position: relative; -webkit-app-region: no-drag; display: flex; }
#dot {
  /* On the disc's RIM, not inside it. Tucked against the glyph it landed
     within the neuron's own glow and read as a smudge on the artwork rather
     than as a mark about it. The dark ring punches it back out of the glow. */
  position: absolute; top: -3px; right: -3px;
  width: 10px; height: 10px; border-radius: 50%;
  background: #ff9d6e;
  border: 2px solid rgba(20,18,30,0.92);
  opacity: 0; transform: scale(0.4);
  transition: opacity 180ms ease, transform 180ms ease;
}
#pill.unread #dot { opacity: 1; transform: scale(1); }
#pill.unread #glyph, #pill.speaking #glyph { filter: var(--neuron-live); }

#say {
  -webkit-app-region: no-drag;
  color: var(--bubble-text);
  font-size: 13px;
  line-height: 1.35;
  max-width: 460px;
  max-height: 9.5em;
  overflow-y: auto;
  overflow-wrap: anywhere;
  cursor: pointer;
}
#pill.dormant #say, #pill.dormant #close { display: none; }

#close {
  -webkit-app-region: no-drag;
  flex: 0 0 auto;
  width: 20px; height: 20px;
  border: 0; border-radius: 50%;
  background: transparent;
  color: var(--bubble-dim);
  font-size: 15px; line-height: 1;
  cursor: pointer;
}
#close:hover { color: var(--bubble-text); background: rgba(255,255,255,0.08); }

@media (prefers-reduced-motion: reduce) {
  #pill, #glyph, #dot { transition: none; }
}
</style>
</head>
<body>
<div id="pill" class="dormant" role="status" aria-live="polite">
  <div id="glyph-wrap">
    <img id="glyph" src="/static/neuron_glyph.svg" alt="Aura" title="Aura"/>
    <span id="dot" aria-hidden="true"></span>
  </div>
  <div id="say"></div>
  <button id="close" title="Clear" aria-label="Clear message">×</button>
</div>

<script src="/static/bubble.js" defer></script>
</body>
</html>
